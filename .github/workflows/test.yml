name: Tests
on: [push]
env:
  BUILD_TYPE: Debug
  QT_Version: '6.10.3'

jobs:
  tests:
    name: Build and run tests
    strategy:
      fail-fast: false
      matrix:
        buildTarget: [ubuntu, windows, macos]
        include:
          - buildTarget: ubuntu
            os: ubuntu-latest
            # empty arch lets aqt pick the default (gcc_64); passing it explicitly
            # makes install-qt-action fail in its listing step on the ubuntu runner
            qtArch: ''
            qtDir: 'gcc_64'
            qtTools: ''
            installerCommands1: 'sudo apt-get update'
            installerCommands2: 'sudo apt-get install -y libxcb-cursor0 libgl1-mesa-dri libegl1 libopengl0'
            cmakeOptions: '-DOPENSSL_USE_STATIC_LIBS=FALSE'
          - buildTarget: windows
            os: windows-latest
            qtArch: 'win64_mingw'
            qtDir: 'mingw_64'
            qtTools: 'tools_mingw1310'
            installerCommands1: choco install openssl --force -y --install-arguments="'/DIR=C:/openSsl/'"
            installerCommands2: ''
            cmakeOptions: '"-DCMAKE_GENERATOR:STRING=MinGW Makefiles" -DOPENSSL_LIB_PATH="C:/openSsl/bin" -DOPENSSL_INCLUDE_DIR="C:/openSsl/include" -DOPENSSL_USE_STATIC_LIBS="ON" -DPRECOMPILEDOPENSSL="ON" "-DCMAKE_C_COMPILER:FILEPATH=D:/a/Commander_Wars/Commander_Wars/qt/Qt/Tools/mingw1310_64/bin/gcc.exe" "-DCMAKE_CXX_COMPILER:FILEPATH=D:/a/Commander_Wars/Commander_Wars/qt/Qt/Tools/mingw1310_64/bin/g++.exe"'
          - buildTarget: macos
            os: macos-15
            qtArch: 'clang_64'
            qtDir: 'clang_64'
            qtTools: ''
            installerCommands1: ''
            installerCommands2: ''
            cmakeOptions: '-DOPENSSL_ROOT_DIR=/usr/local/opt/openssl'

    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7
      with:
          path: 'source'
          submodules: 'true'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
          target: 'desktop'
          version: ${{env.QT_Version}}
          arch: ${{matrix.qtArch}}
          modules: 'qtmultimedia'
          dir: '${{github.workspace}}/qt/'
          install-deps: "true"
          tools: '${{matrix.qtTools}}'
          set-env: 'true'

    - name: Install OS Dependencies 1
      run: ${{matrix.installerCommands1}}

    - name: Install OS Dependencies 2
      run: ${{matrix.installerCommands2}}

    - name: Configure tests cmake
      run: |
        cmake \
        -S "${{github.workspace}}/source/tests" \
        -B "${{github.workspace}}/build_tests" \
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
        -DCMAKE_PREFIX_PATH="${{github.workspace}}/qt/Qt/${{env.QT_Version}}/${{matrix.qtDir}}/" \
        -DQt6_DIR=${{github.workspace}}/qt/Qt/${{env.QT_Version}}/${{matrix.qtDir}}/lib/cmake/Qt6/ \
        ${{matrix.cmakeOptions}}

    - name: Build tests
      run: cmake --build '${{github.workspace}}/build_tests' -j4

    # windows: put Qt's bin dir on PATH so the test exe resolves its DLLs even if
    # windeployqt missed something, and log the deployed runtime for diagnosis
    - name: Prepare windows test runtime
      if: matrix.buildTarget == 'windows'
      working-directory: '${{github.workspace}}/build_tests'
      run: |
        echo "${{github.workspace}}/qt/Qt/${{env.QT_Version}}/${{matrix.qtDir}}/bin" >> "$GITHUB_PATH"
        echo "Deployed test dir contents:"
        ls -la tests/ || true
        echo "Deployed platforms:"
        ls -la tests/platforms/ || true

    # windows diagnosis: run the exe directly (not via ctest) so any loader/
    # platform error surfaces, and dump which DLLs it resolves
    - name: Diagnose windows test exe
      if: matrix.buildTarget == 'windows'
      working-directory: '${{github.workspace}}/build_tests/tests'
      run: |
        echo "=== ldd-style import check ==="
        "$GITHUB_WORKSPACE/qt/Qt/${{env.QT_Version}}/${{matrix.qtDir}}/bin/objdump.exe" -p ./commander_wars_tests.exe | grep -i "DLL Name" || true
        echo "=== direct run ==="
        QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 timeout 30 ./commander_wars_tests.exe; echo "exit code: $?"

    # the test harness never shows a window or creates a GL context, so it runs
    # headless with the offscreen platform plugin on every runner
    - name: Run tests
      working-directory: '${{github.workspace}}/build_tests'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --output-on-failure -V
