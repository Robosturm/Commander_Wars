# Overlay applied on top of normal.ini when the AI behavior rule is Counterpoint and the player's
# ai type is Normal. The Offensive and Defensive Normal profiles run the Counterpoint production
# strategy but keep their own normal.ini tuning, since the gate is on the ai type.
# readIni only assigns keys the file actually contains, so every value omitted here keeps
# its normal.ini setting.

[%General]
# larger counter damage budget when repositioning, so Counterpoint accepts riskier moves than the
# 0.15 in normal.ini. The value is a fraction of the unit's cost, so raising it accepts more risk.
# Deliberately not 0.2 or 0.1, which are normalOffensive.ini and normalDefensive.ini, so a test can
# still tell whether a controller was handed this profile or its own.
MinMovementDamage=0.25
# a unit counts as a real threat at a lower damage value, so counters are queued earlier
NotAttackableDamage=20
# wider enemy horizon to match Counterpoint's whole army production view
EnemyPruneRange=5

[Moving]
# slightly wider territory marking per unit
InfluenceUnitRange=2.5

[Attacking]
# indirects hold position more readily
OwnIndirectAttackValue=5
# stronger pull towards finishing damaged units
EnemyKillBonus=1.4
# less weight on predicted counter damage
EnemyCounterDamageMultiplier=7
# nearby friendly firepower counts for more
SupportDamageBonus=1.0
# enemy territory is less of a deterrent
InfluenceMultiplier=0.6
